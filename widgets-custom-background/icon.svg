<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1d93"/>
      <stop offset="1" stop-color="#0a8f93"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9ae"/>
      <stop offset="1" stop-color="#ff7fae"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="50" y="76" width="152" height="112" rx="16"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0b0630" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#bg)"/>

  <!-- stacked backgrounds behind -->
  <rect x="72" y="52" width="152" height="112" rx="16" fill="#fff" fill-opacity="0.16"/>
  <rect x="61" y="64" width="152" height="112" rx="16" fill="#fff" fill-opacity="0.28"/>

  <!-- front card: a wallpaper -->
  <g filter="url(#shadow)">
    <rect x="50" y="76" width="152" height="112" rx="16" fill="url(#sky)"/>
  </g>
  <g clip-path="url(#card)">
    <rect x="50" y="76" width="152" height="112" fill="url(#sky)"/>
    <circle cx="158" cy="112" r="15" fill="#fff6d8"/>
    <path d="M40 188 L88 124 L116 160 L146 130 L212 188 Z" fill="#7a52dc"/>
    <path d="M40 188 L74 150 L104 188 Z" fill="#33177f"/>
    <path d="M98 188 L150 146 L212 188 Z" fill="#33177f"/>
  </g>
  <rect x="50" y="76" width="152" height="112" rx="16" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2"/>

  <!-- video badge -->
  <circle cx="196" cy="186" r="30" fill="#fff"/>
  <circle cx="196" cy="186" r="30" fill="none" stroke="#3a1d93" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M187 171 L187 201 L212 186 Z" fill="#3a1d93" stroke="#3a1d93" stroke-width="5" stroke-linejoin="round"/>
</svg>
