version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: widgets-custom-background_web_1
      APP_PORT: 38888
      PROXY_AUTH_ADD: "true"
    container_name: widgets-custom-background_app_proxy_1

  web:
    image: python:3.12-alpine
    container_name: widgets-custom-background_web_1
    restart: unless-stopped
    command: ["python3", "-u", "/app/server.py"]
    environment:
      PORT: "38888"
      MEDIA_DIR: /app/data/media
      STATE_DIR: /app/data/state
      # Where the dashboard's files are mounted inside this container
      UI_DIR: /host-ui
      # Host-side path of the media folder; the dashboard serves it via a symlink
      HOST_MEDIA_DIR: ${APP_DATA_DIR}/data/media
    volumes:
      - ${APP_DATA_DIR}/server.py:/app/server.py:ro
      - ${APP_DATA_DIR}/data:/app/data
      # umbrelOS dashboard files (umbreld serves /opt/umbreld/ui)
      - /opt/umbreld/ui:/host-ui
    expose:
      - "38888"
