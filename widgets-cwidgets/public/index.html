<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>cwidgets</title>
<style>
  body { margin: 0; padding: 40px 20px; background: #0f1115; color: #f2f2f2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { text-align: center; font-weight: 600; margin-bottom: 4px; }
  p.lead { text-align: center; color: #9a9fa6; max-width: 560px; margin: 8px auto 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 900px; margin: 0 auto; }
  .card { background: #1a1d24; border-radius: 16px; padding: 20px 22px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 12px; }
  .card .slot-name { font-weight: 600; font-size: 13px; color: #9a9fa6; text-transform: uppercase; letter-spacing: 0.04em; }
  select { background: #0f1115; color: #f2f2f2; border: 1px solid #2a2e37; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .preview { background: #0f1115; border-radius: 10px; padding: 14px; }
  .preview .title { font-size: 11px; color: #9a9fa6; text-transform: uppercase; letter-spacing: 0.04em; }
  .preview .text { font-size: 22px; font-weight: 600; margin: 4px 0 2px; }
  .preview .subtext { font-size: 12px; color: #9a9fa6; }
  .settings { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #2a2e37; padding-top: 10px; }
  .settings label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cfd3d9; cursor: pointer; }
  .hint { text-align: center; margin-top: 48px; color: #9a9fa6; font-size: 13px; max-width: 560px; margin-left: auto; margin-right: auto; line-height: 1.5; }
</style>
</head>
<body>
  <h1>cwidgets</h1>
  <p class="lead">umbrelOS gives you 3 cwidgets slots on your home screen. Pick what each one shows below.</p>
  <div class="grid" id="grid"></div>
  <p class="hint">Changes here take effect on your home screen automatically — no need to re-add the widgets after switching their type.</p>

  <script>
    let types = []

    function settingsBlock(slot) {
      if (!slot.settingsSchema.length) return ""
      const rows = slot.settingsSchema.map((s) => `
        <label>
          <input type="checkbox" data-key="${s.key}" ${slot.settings[s.key] ? "checked" : ""} />
          ${s.label}
        </label>
      `).join("")
      return `<div class="settings">${rows}</div>`
    }

    function renderCard(slot, index) {
      const card = document.createElement("div")
      card.className = "card"
      const options = types.map((t) => `<option value="${t.id}" ${t.id === slot.type ? "selected" : ""}>${t.name}</option>`).join("")
      card.innerHTML = `
        <div class="slot-name">Slot ${index + 1}</div>
        <select data-slot="${slot.id}">${options}</select>
        <div class="preview">
          <div class="title">${slot.preview.title}</div>
          <div class="text">${slot.preview.text}</div>
          <div class="subtext">${slot.preview.subtext}</div>
        </div>
        ${settingsBlock(slot)}
      `
      card.querySelector("select").addEventListener("change", async (e) => {
        await fetch(`/api/slots/${slot.id}/type`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: e.target.value }),
        })
        refresh()
      })
      card.querySelectorAll('input[type="checkbox"]').forEach((box) => {
        box.addEventListener("change", async (e) => {
          const key = e.target.getAttribute("data-key")
          await fetch(`/api/slots/${slot.id}/settings`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ [key]: e.target.checked }),
          })
          refresh()
        })
      })
      return card
    }

    async function refresh() {
      const res = await fetch("/api/slots")
      const data = await res.json()
      types = data.types
      const grid = document.getElementById("grid")
      grid.innerHTML = ""
      data.slots.forEach((slot, i) => grid.appendChild(renderCard(slot, i)))
    }

    refresh()
    setInterval(refresh, 2000)
  </script>
</body>
</html>
