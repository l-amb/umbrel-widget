manifestVersion: 1
id: widgets-clock-widget
category: utilities
name: Clock Widget
version: "1.0.0"
tagline: A simple clock widget for your umbrelOS home screen
description: >-
  Adds a widget showing the current time and date.
developer: you
website: https://github.com/l-amb/umbrel-widget
repo: https://github.com/l-amb/umbrel-widget
support: https://github.com/l-amb/umbrel-widget/issues
port: 3000
gallery:
  - 1.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "clock"
    type: "text-with-buttons"
    refresh: "1s"
    endpoint: "widget-server:3000/widgets/clock"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Current Time"
      text: "2:34 PM"
      subtext: "Fri, Sep 5"
